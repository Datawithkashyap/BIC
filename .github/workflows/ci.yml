name: BIC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff
      - name: Lint, syntax check & unit tests
        run: |
          ruff check core/ api.py tests/
          python -m py_compile app.py api.py core/sql_engine.py core/llm_copilot.py core/analyst_workbench.py core/telemetry.py scripts/eval_sql.py scripts/eval_semantic.py
          pytest -v